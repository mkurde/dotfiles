[settings]
auto_install = true
activate_aggressive = true
use_versions_host = false
use_versions_host_track = false
idiomatic_version_file_enable_tools = ["go", "java", "node", "python", "terraform", "helm", "opentofu", "terragrunt"]

[tools]
actionlint = "1"
jq = "1"
just = "1"
kubeconform = "0"
prek = "latest"
shellcheck = "0"
skaffold = "2"
terraform = "1"
terraform-docs = "0"
terragrunt = "1"
tflint = "0"
tfsec = "1"
yq = "4"
